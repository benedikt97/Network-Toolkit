ctrl_interface=/var/run/wpa_supplicant
ctrl_interface_group=root
ap_scan=0

network={
    key_mgmt=IEEE8021X
    eap=TLS
    identity="anonymous"
#    ca_cert="/path/to/ca-certificate.pem"
    client_cert="./cert.pem"
    private_key="./key.pem"
    private_key_passwd="your_private_key_password_if_needed"
    eapol_flags=0
}
