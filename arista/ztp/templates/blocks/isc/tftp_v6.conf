  # DHCPv6 option 17 value: enterprise (4 bytes), sub-option (2 bytes),
  # sub-option length (2 bytes), then "Arista;<model>;...".  Match only
  # the vendor prefix so every Arista DCS/CCS model receives the ZTP URL.
  if substring(option dhcp6.vendor-opts, 8, 6) = "Arista" {
    option dhcp6.bootfile-url "http://${TFTP_URL_HOST}/${TFTP_PATH}";
  }
