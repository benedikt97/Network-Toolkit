!
! Arista EOS DHCP server configuration for Arista AP ZTP
! CV-CUE Server: ${CVCUE}
! Vendor sub-option 1 = CV-CUE server, sub-option 4 = SPECTRATALK.
! Requested AP VCI pattern: ${MATCHSTRING}
!
! EOS applies the vendor option to all matching Arista clients. Place APs
! in a dedicated subnet when this option must not be offered to other clients.
!
dhcp server
${EOS_TFTP_BLOCK}
   !
   subnet ${NETWORK}
      range ${RANGESTART} ${RANGEEND}
      default-gateway ${GATEWAY}
      dns server ipv4 ${NAMESERVER}
${EOS_WIFI_BLOCK}
