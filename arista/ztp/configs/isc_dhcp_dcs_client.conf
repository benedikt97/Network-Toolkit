# DHCPv4 client configuration to test Arista DCS/CCS switch ZTP.
# Arista EOS switches identify themselves with the "Arista" vendor class.
# Usage: dhclient -cf isc_dhcp_dcs_client.conf -d -v <interface>

option vendor-class-identifier code 60 = string;

send vendor-class-identifier "Arista";

# Request the boot server and file supplied by DHCP options 66 and 67,
# which are used by the DCS/CCS ZTP workflow.
request subnet-mask, broadcast-address, time-offset, routers,
        domain-name, domain-name-servers, host-name,
        tftp-server-name, bootfile-name;
