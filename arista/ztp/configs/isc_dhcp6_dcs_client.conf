# DHCPv6 client configuration to test Arista DCS/CCS switch ZTP.
# The vendor-class payload is the Arista enterprise number followed by
# the DCS/CCS "Arista" vendor-class string.
# Usage: dhclient -6 -cf isc_dhcp6_dcs_client.conf -d -v <interface>

option dhcp6.vendor-class code 16 = string;

send dhcp6.vendor-class "\x00\x00\x42\x05\x00\x06\x41\x72\x69\x73\x74\x61";

# Request ZTP delivery information as well as any Arista vendor options.
also request dhcp6.bootfile-url;
also request dhcp6.vendor-opts;
