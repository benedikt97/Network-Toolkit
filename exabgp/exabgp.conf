# 1. Prozess global definieren (außerhalb des Neighbors)
process flowspec-api {
    run /usr/bin/python3 /app.py;
    encoder text;
}

# 2. Neighbor konfigurieren
neighbor 10.0.0.1 {
    router-id 10.0.0.2;
    local-address 10.0.0.2;
    local-as 65002;
    peer-as 65001;
    
    family {
        ipv4 flow;
    }
    
    # 3. Prozess an diesen Neighbor binden
    api {
        processes [ flowspec-api ];
    }
}